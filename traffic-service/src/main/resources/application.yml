server:
  port: ${PORT:${SERVER_PORT:8081}}
spring:
  application:
    name: traffic-service
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
    username: ${ORACLE_USER:rm562267}
    password: ${ORACLE_PASSWORD:fiap26}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    table: flyway_travessia_history
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.0
  cloud:
    discovery:
      enabled: true
      client:
        service-url:
          defaultZone: ${EUREKA_URI:${SPRING_CLOUD_DISCOVERY_CLIENT_SERVICE-URL_DEFAULTZONE:http://eureka:8761/eureka/}}
weather:
  api-key: ${WEATHER_API_KEY}
  base-url: https://api.openweathermap.org/data/2.5
