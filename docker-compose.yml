services:
  eureka:
    build:
      context: .
      dockerfile: ./eureka-server/Dockerfile
    container_name: eureka
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761

  gateway:
    build:
      context: .
      dockerfile: ./gateway-service/Dockerfile
    container_name: gateway
    depends_on:
      - eureka
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SERVER_PORT=8080
      - SPRING_CLOUD_DISCOVERY_CLIENT_SERVICE-URL_DEFAULTZONE=http://eureka:8761/eureka/
    restart: unless-stopped

  traffic:
    build:
      context: .
      dockerfile: ./traffic-service/Dockerfile
    container_name: traffic
    depends_on:
      - eureka
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - SERVER_PORT=8081
      - SPRING_CLOUD_DISCOVERY_CLIENT_SERVICE-URL_DEFAULTZONE=http://eureka:8761/eureka/
    restart: unless-stopped
